<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff2f8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="アイカツ管理">
<title>アイカツ！アンコール カード管理</title>
<style>
:root{color-scheme:light;--pink:#f05b9c;--hot:#d83f83;--pale:#fff2f8;--paler:#fff9fc;--line:#f5c7dc;--ink:#5e3449;--muted:#9c7288;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;max-width:900px;margin:auto;background:linear-gradient(180deg,#fff8fc,#fff);padding-bottom:90px}.hero{padding:22px 18px 18px;background:linear-gradient(135deg,#ffdbeb,#fff5fa 65%,#fce5f4);border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--hot);font-weight:800}.hero h1{font-size:23px;line-height:1.25;margin:7px 0;color:#b82e70}.hero p{font-size:12px;margin:0;color:#94617b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px 14px 4px}.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:12px 9px;box-shadow:0 3px 10px #e9a4c522}.stat span{display:block;font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:23px;color:var(--hot);margin-top:2px}.tools{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap}.search{flex:1;min-width:160px;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:white;outline-color:var(--pink)}.pill,.primary,.soft{border-radius:12px;padding:10px 13px;font-size:12px;font-weight:750}.primary{background:var(--pink);color:white}.soft{background:#ffe1ef;color:#b82e70;border:1px solid #f8c3dc}.tabs{display:flex;gap:7px;overflow:auto;padding:4px 14px 12px}.tab{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:white;color:#a15a7e;font-size:12px}.tab.active{background:var(--hot);color:white;border-color:var(--hot)}.filterrow{padding:0 14px 12px;display:flex;gap:8px}.filterrow select{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--ink);font-size:12px}.sectionhead{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px;font-size:13px;font-weight:800}.count{font-size:11px;color:var(--muted);font-weight:500}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:0 12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 4px 13px #e8a3c51b}.art{aspect-ratio:3/4;background:linear-gradient(145deg,#ffe2ef,#fff8fc 55%,#f7d6e9);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover}.placeholder{text-align:center;padding:10px;color:#d45a95}.placeholder .star{font-size:34px;display:block}.placeholder b{font-size:13px;display:block}.placeholder small{font-size:10px}.rarity{position:absolute;left:7px;top:7px;background:#fffdf2;color:#a26a23;border:1px solid #f5dba2;border-radius:6px;padding:4px 6px;font-size:9px;font-weight:800}.cardbody{padding:10px}.code{font-size:10px;color:#bc6190;font-weight:800}.name{font-size:12px;font-weight:750;margin:4px 0 9px;min-height:18px;overflow-wrap:anywhere}.qtyrow{display:flex;align-items:center;justify-content:space-between;gap:5px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:27px;height:27px;border-radius:9px;background:#ffe5f0;color:#bd397b;font-weight:900}.qty b{font-size:13px;min-width:14px;text-align:center}.tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.tag{font-size:10px;background:#fff0f7;color:#c14a84;border-radius:6px;padding:4px 6px}.iconbtn{background:transparent;color:#c14a84;font-size:17px;padding:0 3px}.empty{margin:20px 14px;padding:28px 15px;text-align:center;border:1px dashed var(--line);border-radius:15px;color:var(--muted);font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:900px;margin:auto;display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));background:#fffdfd;border-top:1px solid var(--line);box-shadow:0 -5px 18px #e9a4c522}.bottom button{background:transparent;color:#a55d80;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:55px}.bottom button span{font-size:20px}.modalback{position:fixed;inset:0;background:#51213b77;display:none;align-items:flex-end;justify-content:center;z-index:5}.modalback.show{display:flex}.modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:#fff9fc;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}.modal h2{margin:0 0 14px;font-size:18px;color:#b82e70}.field{display:block;margin:11px 0;font-size:12px;color:#9b587a;font-weight:700}.field input,.field select{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink)}.modalactions{display:flex;gap:8px;margin-top:17px}.modalactions button{flex:1}.note{font-size:11px;color:#a17b8e;line-height:1.6;padding:12px 16px}.hide{display:none!important}@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{padding:28px}.stats{padding-left:20px;padding-right:20px}.tools,.tabs,.filterrow{padding-left:20px;padding-right:20px}.grid{padding:0 20px}.stat{padding:14px}}
</style><link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
</head>
<body><main class="app">
<header class="hero"><div class="eyebrow">MY AIKATSU! ENCORE COLLECTION</div><h1>アイカツ！アンコール<br>カード管理ノート ♡</h1><p>わたしだけのカードコレクションをつくろう！</p></header>
<section class="stats"><div class="stat"><span>登録カード</span><strong id="statCards">0</strong></div><div class="stat"><span>所持枚数</span><strong id="statOwned">0</strong></div><div class="stat"><span>ほしいカード</span><strong id="statWanted">0</strong></div></section>
<div class="tools"><input id="search" class="search" placeholder="カード名・番号で検索…" aria-label="カード検索"><button class="primary" id="addBtn">＋ カード追加</button></div>
<nav class="tabs" id="tabs"><button class="tab active" data-tab="all">すべて</button><button class="tab" data-tab="owned">所持カード</button><button class="tab" data-tab="wanted">ほしい♡</button><button class="tab" data-tab="trade">交換に出せる</button><button class="tab" data-tab="promo">プロモ</button></nav>
<div class="filterrow"><select id="rarity"><option value="">レアリティ：すべて</option><option>PR</option><option>R</option><option>N</option><option>ER</option><option>プロモ</option></select><select id="sort"><option value="code">番号順</option><option value="owned">所持枚数順</option><option value="wanted">ほしい順</option></select></div>
<div class="sectionhead"><span id="listTitle">カード一覧</span><span class="count" id="count">0枚</span></div><section class="grid" id="grid"></section><div class="empty hide" id="empty">カードが見つからなかったよ。<br>「＋カード追加」から登録してね ♡</div>
<p class="note">※このアプリのデータは、この端末のブラウザ内に保存されます。機種変更・ブラウザデータ削除に備えて、設定からバックアップを保存してね。カード画像は自分で登録できます。</p>
<nav class="bottom"><button data-tab="all"><span>♡</span>一覧</button><button data-tab="owned"><span>▣</span>所持</button><button data-tab="wanted"><span>☆</span>ほしい</button><button id="bottomAdd"><span>＋</span>追加</button><button id="settingsBtn"><span>⚙</span>設定</button></nav>
</main>
<div class="modalback" id="modalback"><section class="modal"><h2 id="modalTitle">カードを追加 ♡</h2><form id="cardForm"><input type="hidden" id="editId"><label class="field">カード番号<input id="code" placeholder="例：E1-01_PR" required></label><label class="field">カード名<input id="name" placeholder="カード名（わかれば）"></label><label class="field">レアリティ<select id="cardRarity"><option value="">未設定</option><option>PR</option><option>R</option><option>N</option><option>ER</option><option>プロモ</option></select></label><label class="field">所持枚数<input id="ownedInput" type="number" min="0" value="0"></label><label class="field"><span><input id="wantedInput" type="checkbox" style="display:inline;width:auto;margin-right:6px">ほしいカードに登録</span></label><label class="field"><span><input id="tradeInput" type="checkbox" style="display:inline;width:auto;margin-right:6px">交換に出せる</span></label><label class="field">カード画像（任意）<input id="imageInput" type="file" accept="image/*"></label><div class="modalactions"><button type="button" class="soft" id="cancelBtn">キャンセル</button><button type="submit" class="primary">保存する ♡</button></div></form></section></div>
<div class="modalback" id="settingsBack"><section class="modal"><h2>データ設定 ⚙</h2><p style="font-size:12px;line-height:1.7">登録データをJSONファイルとしてバックアップできます。別の端末で使うときは、ここから復元してね。</p><div class="modalactions"><button class="soft" id="exportBtn">バックアップ保存</button><button class="soft" id="importBtn">バックアップ復元</button><input id="importFile" class="hide" type="file" accept="application/json"></div><div class="modalactions"><button class="soft" id="officialBtn">公式カードリスト</button><button class="primary" id="settingsClose">閉じる</button></div></section></div>
<script>
const STORE='aikatsuEncoreManager_v1';let cards=[];let activeTab='all';let imageData='';
const $=id=>document.getElementById(id);
try{cards=JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){cards=[]}
// The official list currently shows 85 entries for the first-series filter. Seed number-only records so each can be named, pictured and tracked by the user without inventing official card names.
if(!localStorage.getItem(STORE)){cards=Array.from({length:85},(_,i)=>({id:'seed-'+(i+1),code:'E1-'+String(i+1).padStart(2,'0'),name:'',rarity:'',owned:0,wanted:false,trade:false,image:''}));save()}
function save(){localStorage.setItem(STORE,JSON.stringify(cards));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.trim().toLowerCase(),rarity=$('rarity').value,sort=$('sort').value;let list=cards.filter(c=>{const matches=(c.code+' '+c.name).toLowerCase().includes(q);return matches&&(!rarity||c.rarity===rarity)&&(activeTab==='all'||(activeTab==='owned'&&c.owned>0)||(activeTab==='wanted'&&c.wanted)||(activeTab==='trade'&&c.trade)||(activeTab==='promo'&&(c.rarity==='プロモ'||c.code.toLowerCase().startsWith('ep-')))});list.sort((a,b)=>sort==='owned'?b.owned-a.owned:sort==='wanted'?Number(b.wanted)-Number(a.wanted):a.code.localeCompare(b.code,undefined,{numeric:true}));$('statCards').textContent=cards.length;$('statOwned').textContent=cards.reduce((n,c)=>n+(Number(c.owned)||0),0);$('statWanted').textContent=cards.filter(c=>c.wanted).length;$('count').textContent=list.length+'枚';$('listTitle').textContent=({all:'カード一覧',owned:'所持カード',wanted:'ほしいカード ♡',trade:'交換に出せるカード',promo:'プロモカード'})[activeTab];$('grid').innerHTML=list.map(c=>`<article class="card"><div class="art" data-open="${esc(c.id)}">${c.image?`<img src="${c.image}" alt="${esc(c.name||c.code)}">`:`<div class="placeholder"><span class="star">✧</span><b>AIKATSU!</b><small>${esc(c.code)}</small><br><small>タップして編集・画像登録</small></div>`}<span class="rarity">${esc(c.rarity||'未設定')}</span></div><div class="cardbody"><div class="code">${esc(c.code)}</div><div class="name">${esc(c.name||'カード名未登録')}</div><div class="qtyrow"><div class="qty"><button data-dec="${esc(c.id)}" aria-label="所持数を減らす">−</button><b>${Number(c.owned)||0}</b><button data-inc="${esc(c.id)}" aria-label="所持数を増やす">＋</button></div><button class="iconbtn" data-want="${esc(c.id)}" title="ほしいカード">${c.wanted?'♥':'♡'}</button><button class="iconbtn" data-trade="${esc(c.id)}" title="交換">${c.trade?'⇄':'＋'}</button><button class="iconbtn" data-edit="${esc(c.id)}" title="編集">⋯</button></div><div class="tags">${c.owned>1?`<span class="tag">ダブり ${c.owned-1}枚</span>`:''}${c.trade?'<span class="tag">交換OK</span>':''}${c.wanted?'<span class="tag">ほしい♡</span>':''}</div></div></article>`).join('');$('empty').classList.toggle('hide',list.length>0);}
function openForm(c){$('cardForm').reset();$('editId').value=c?.id||'';$('modalTitle').textContent=c?'カードを編集 ♡':'カードを追加 ♡';$('code').value=c?.code||'';$('name').value=c?.name||'';$('cardRarity').value=c?.rarity||'';$('ownedInput').value=c?.owned||0;$('wantedInput').checked=!!c?.wanted;$('tradeInput').checked=!!c?.trade;imageData=c?.image||'';$('modalback').classList.add('show')}
function closeForm(){$('modalback').classList.remove('show')}
$('grid').addEventListener('click',e=>{const t=e.target.closest('button,[data-open]');if(!t)return;const id=t.dataset.inc||t.dataset.dec||t.dataset.want||t.dataset.trade||t.dataset.edit||t.dataset.open;const c=cards.find(x=>x.id===id);if(!c)return;if(t.dataset.inc){c.owned=(Number(c.owned)||0)+1;save()}else if(t.dataset.dec){c.owned=Math.max(0,(Number(c.owned)||0)-1);save()}else if(t.dataset.want!==undefined){c.wanted=!c.wanted;save()}else if(t.dataset.trade!==undefined){c.trade=!c.trade;save()}else openForm(c)});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;activeTab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===activeTab));render()});document.querySelectorAll('.bottom [data-tab]').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===activeTab));render()}));['search','rarity','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('addBtn').onclick=$('bottomAdd').onclick=()=>openForm();$('cancelBtn').onclick=closeForm;$('modalback').addEventListener('click',e=>{if(e.target===$('modalback'))closeForm()});$('imageInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>1_500_000){alert('画像は1.5MB以下にしてね。');e.target.value='';return}const r=new FileReader();r.onload=()=>imageData=r.result;r.readAsDataURL(f)});
$('cardForm').addEventListener('submit',e=>{e.preventDefault();const id=$('editId').value||'c-'+Date.now();const existing=cards.find(c=>c.id===id);const c={id,code:$('code').value.trim(),name:$('name').value.trim(),rarity:$('cardRarity').value,owned:Math.max(0,Number($('ownedInput').value)||0),wanted:$('wantedInput').checked,trade:$('tradeInput').checked,image:imageData};if(existing)Object.assign(existing,c);else cards.push(c);closeForm();save()});
$('settingsBtn').onclick=()=>$('settingsBack').classList.add('show');$('settingsClose').onclick=()=>$('settingsBack').classList.remove('show');$('settingsBack').addEventListener('click',e=>{if(e.target===$('settingsBack'))$('settingsBack').classList.remove('show')});$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(cards,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aikatsu-encore-backup.json';a.click();URL.revokeObjectURL(a.href)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw Error();if(confirm('現在のデータをバックアップの内容で置き換える？')){cards=data;save();alert('復元したよ ♡')}}catch(err){alert('バックアップファイルを読み込めなかったよ')}};r.readAsText(f)};$('officialBtn').onclick=()=>window.open('https://dcd.aikatsu.com/encore/cardlist/','_blank','noopener');render();
</script><script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {})); }</script>
</body></html>
